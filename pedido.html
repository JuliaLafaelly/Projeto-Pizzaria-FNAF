
<!DOCTYPE html>

<body>
    <div class="inicio">
        <h1>Freddy's Pizzaria</h1>
        <p>Onde o sabor encontra o terror!</p>
            </div>
            <nav>
                    <ul>
                        <li><a href="index.html">Inicio</a></li>

    <section id="pedido">
        <h2>Faça seu pedido</h2>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required />

            <label for="pizza">escolha sua pizza:</label>
            <select id="pizza" name="pizza" required >
                <option value="NULL"></option>
                <option value="Freddy">Pizza do Freddy</option>
                <option value="Chica">Pizza da Chica</option>
                <option value="Foxy">Pizza do Foxy</option>
                <option value="Bonnie">Pizza do Bonnie</option>
                <option value="Springtrap">Pizza do Springtrap</option>
                <option value="Golden Freddy">Pizza do Golden Freddy</option>
                <option value="Circus Baby">Pizza do Circus Baby</option>
                <option value="Ennard">Pizza do Ennard</option>
                <option value="Puppet">Pizza da Puppet</option>
                <option value="Glamrock Freddy">Pizza do Glamrock Freddy</option>
            </select>

        <label for="endereço">endereço:</label>
        <input type="text" id="endereço" name="endereço" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

          <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required />

       
        
        <button type="submit">enviar pedido</button>
        
        </form>
    </section>

        <footer>
            <p>&copy; 2025 Freddy's Pizzaria - Cuidado com o turno da noite... </p>
        </footer>
        
    </body>
